# Packs, and runs the tests on each platform: .NET 8 on Windows, Linux x64 and arm64, and macOS arm64, and .NET Framework 4.8 on
# Windows, with the model archive downloaded from the address of the Python client and kept in the cache of the CI. The hosted models of
# Chroma Cloud come from Hugging Face and are kept in the cache too: Qwen3-Embedding-0.6B in float16 and SPLADE on every platform, and
# Qwen3-Embedding-0.6B in float32 on Linux x64 only, so that the cache of the repository stays within its 10 GB. The reference of
# Python computes the vectors of the test texts again with chromadb, and those of the hosted models with onnxruntime, and compares them
# with the files of the tests. A version tag, like
# v1.0.0-preview.1, also publishes: the GitHub release with the packages and their build provenance, then the packages on NuGet, with
# trusted publishing, in the environment nuget. The service, ChromaDotNet.Embeddings.Server, is tested on Linux x64 and arm64: through
# HTTP, from its tool package with the clients of Python and JavaScript, and in its image; its image for both architectures is built on
# every run. A tag of the service, like server-v0.1.0-preview.1, publishes it: the GitHub release with the package of the tool and its
# build provenance, the image on ghcr.io/chromadotnet/embeddings-server with its provenance and its Sigstore signature, then the tool on
# NuGet, in the environment nuget.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*', 'server-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/server-v') }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # The SHA-256 hash of onnx.tar.gz, as in the library and in build/fetch-model.sh: the key of the cache of the model.
  MODEL_SHA256: 913d7300ceae3b2dbc2c50d1de4baacab4be7b9380491c27fab7418616a16ec3

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: The tag is the version of the package, a preview
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(dotnet msbuild src/ChromaDotNet.Embeddings -getProperty:Version -nologo)
          echo "tag $GITHUB_REF_NAME, version $version"
          test "$GITHUB_REF_NAME" = "v$version"
          case "$version" in *-preview*) ;; *) echo "only previews for now" >&2; exit 1 ;; esac
      - name: Pack
        run: dotnet pack src/ChromaDotNet.Embeddings -c Release
      - name: The packages link their repository and have both targets
        run: python3 build/check-nuspecs.py artifacts/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages

  test:
    name: Tests ${{ matrix.framework }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # hosted: the hosted models the run must test, as CHROMADOTNET_EMBEDDINGS_HOSTED.
        include:
          - runner: windows-latest
            framework: net8.0
            hosted: qwen-fp16,splade
          - runner: ubuntu-24.04
            framework: net8.0
            hosted: qwen-fp16,qwen-fp32,splade
          - runner: ubuntu-24.04-arm
            framework: net8.0
            hosted: qwen-fp16,splade
          - runner: macos-latest
            framework: net8.0
            hosted: qwen-fp16,splade
          - runner: windows-latest
            framework: net48
            hosted: qwen-fp16,splade
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Runner
        run: |
          uname -a
          dotnet --info | grep -E "RID|OS Name|OS Version|Architecture" | sort -u
      - name: Cache of the model archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/model
          key: model-${{ env.MODEL_SHA256 }}
      - name: The model archive, from the address of the Python client
        run: bash build/fetch-model.sh
      # One entry for each model, which every platform can restore: the files are the same everywhere.
      - name: Cache of Qwen3-Embedding-0.6B in float16
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/hosted-models/Qwen3-Embedding-0.6B/fp16
          key: hosted-qwen-fp16-${{ hashFiles('build/fetch-hosted-models.sh') }}
          enableCrossOsArchive: true
      - name: Cache of Qwen3-Embedding-0.6B in float32
        if: contains(matrix.hosted, 'qwen-fp32')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/hosted-models/Qwen3-Embedding-0.6B/fp32
          key: hosted-qwen-fp32-${{ hashFiles('build/fetch-hosted-models.sh') }}
          enableCrossOsArchive: true
      - name: Cache of SPLADE
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/hosted-models/Splade_PP_en_v1
          key: hosted-splade-${{ hashFiles('build/fetch-hosted-models.sh') }}
          enableCrossOsArchive: true
      - name: The hosted models, from Hugging Face
        env:
          HOSTED: ${{ matrix.hosted }}
        run: bash build/fetch-hosted-models.sh ${HOSTED//,/ }
      # The vectors of onnxruntime in Python on this runner: the tests compare those of .NET with them on the same processor.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: onnxruntime 1.28.0
        run: |
          python -m venv artifacts/venv-hosted
          bin=artifacts/venv-hosted/bin
          [ -d "$bin" ] || bin=artifacts/venv-hosted/Scripts
          "$bin/python" -m pip install --quiet --require-hashes -r build/python-hosted-requirements.txt
          echo "HOSTED_PYTHON=$bin/python" >> "$GITHUB_ENV"
      - name: The vectors of the hosted models in Python, on this runner
        env:
          HOSTED: ${{ matrix.hosted }}
        run: |
          fp32=-
          if [[ ",$HOSTED," == *,qwen-fp32,* ]]; then fp32=artifacts/hosted-models/Qwen3-Embedding-0.6B/fp32; fi
          "$HOSTED_PYTHON" -I build/python-hosted-reference.py "$fp32" artifacts/hosted-models/Qwen3-Embedding-0.6B/fp16 \
            artifacts/hosted-models/Splade_PP_en_v1 --output artifacts/python-onnx-runner.json
      - name: Tests
        env:
          CHROMADOTNET_EMBEDDINGS_HOSTED: ${{ matrix.hosted }}
          CHROMADOTNET_EMBEDDINGS_HOSTED_PYTHON: ${{ github.workspace }}/artifacts/python-onnx-runner.json
        run: dotnet test tests/ChromaDotNet.Embeddings.Tests -c Release -f ${{ matrix.framework }} --logger "console;verbosity=normal"

  python-reference:
    name: Reference of Python
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Cache of the model archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/model
          key: model-${{ env.MODEL_SHA256 }}
      - name: The model archive, from the address of the Python client
        run: bash build/fetch-model.sh
      - name: chromadb 1.5.9
        run: |
          python3 -m venv artifacts/venv
          artifacts/venv/bin/python -m pip install --quiet --require-hashes -r build/python-reference-requirements.txt
      - name: The vectors of Python are those of the tests
        run: |
          mkdir -p artifacts/python-model
          cp artifacts/model/onnx.tar.gz artifacts/python-model/
          artifacts/venv/bin/python -I build/python-reference.py artifacts/python-model
      - name: Cache of Qwen3-Embedding-0.6B in float16
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/hosted-models/Qwen3-Embedding-0.6B/fp16
          key: hosted-qwen-fp16-${{ hashFiles('build/fetch-hosted-models.sh') }}
          enableCrossOsArchive: true
      - name: Cache of Qwen3-Embedding-0.6B in float32
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/hosted-models/Qwen3-Embedding-0.6B/fp32
          key: hosted-qwen-fp32-${{ hashFiles('build/fetch-hosted-models.sh') }}
          enableCrossOsArchive: true
      - name: Cache of SPLADE
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/hosted-models/Splade_PP_en_v1
          key: hosted-splade-${{ hashFiles('build/fetch-hosted-models.sh') }}
          enableCrossOsArchive: true
      - name: The hosted models, from Hugging Face
        run: bash build/fetch-hosted-models.sh qwen-fp16 qwen-fp32 splade
      - name: onnxruntime 1.28.0
        run: |
          python3 -m venv artifacts/venv-hosted
          artifacts/venv-hosted/bin/python -m pip install --quiet --require-hashes -r build/python-hosted-requirements.txt
      - name: The vectors of the hosted models in Python are those of the tests
        run: |
          artifacts/venv-hosted/bin/python -I build/python-hosted-reference.py artifacts/hosted-models/Qwen3-Embedding-0.6B/fp32 \
            artifacts/hosted-models/Qwen3-Embedding-0.6B/fp16 artifacts/hosted-models/Splade_PP_en_v1

  server:
    name: Service on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Cache of Qwen3-Embedding-0.6B in float16
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/hosted-models/Qwen3-Embedding-0.6B/fp16
          key: hosted-qwen-fp16-${{ hashFiles('build/fetch-hosted-models.sh') }}
          enableCrossOsArchive: true
      - name: Cache of SPLADE
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/hosted-models/Splade_PP_en_v1
          key: hosted-splade-${{ hashFiles('build/fetch-hosted-models.sh') }}
          enableCrossOsArchive: true
      - name: The hosted models, from Hugging Face
        run: bash build/fetch-hosted-models.sh qwen-fp16 splade
      # The requests Chroma Cloud recorded, through HTTP, against its vectors; the limits, the key and the queue.
      - name: Tests of the service
        env:
          CHROMADOTNET_EMBEDDINGS_HOSTED: qwen-fp16,splade
        run: dotnet test tests/ChromaDotNet.Embeddings.Server.Tests -c Release --logger "console;verbosity=normal"
      - name: The tool, from its package
        run: |
          dotnet pack src/ChromaDotNet.Embeddings.Server -c Release -o artifacts/server-package
          dotnet tool install ChromaDotNet.Embeddings.Server --tool-path artifacts/server-tool --add-source artifacts/server-package --prerelease
          artifacts/server-tool/chromadotnet-embed --Embeddings:CacheDirectory="$PWD/artifacts/hosted-models" --Embeddings:Offline=true \
            > artifacts/server-tool.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/healthz
      # The clients of Chroma with CHROMA_EMBED_URL, against the vectors of Chroma Cloud: Python in a collection of Chroma 1.5.9, and
      # JavaScript. The hashed requirements of chromadb are those of Linux x64.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.runner == 'ubuntu-24.04'
        with:
          python-version: '3.12'
      - name: The Python client of chromadb 1.5.9
        if: matrix.runner == 'ubuntu-24.04'
        env:
          CHROMA_EMBED_URL: http://127.0.0.1:8080
          CHROMA_API_KEY: not-needed-on-loopback
        run: |
          python3 -m venv artifacts/venv
          artifacts/venv/bin/python -m pip install --quiet --require-hashes -r build/python-reference-requirements.txt
          artifacts/venv/bin/python -I build/server-clients/python_client_check.py tests/ChromaDotNet.Embeddings.Tests/TestData/hosted/cloud-v2.json
      - name: The JavaScript clients
        if: matrix.runner == 'ubuntu-24.04'
        env:
          CHROMA_EMBED_URL: http://127.0.0.1:8080
          CHROMA_API_KEY: not-needed-on-loopback
        working-directory: build/server-clients
        run: |
          node --version
          npm ci --ignore-scripts
          node js_client_check.mjs ../../tests/ChromaDotNet.Embeddings.Tests/TestData/hosted/cloud-v2.json
      - name: Log of the tool
        if: always()
        run: cat artifacts/server-tool.log || true
      # The image of this architecture: without a key it does not start; with one, it computes with the models of the cache.
      - name: The image
        run: |
          docker build -f src/ChromaDotNet.Embeddings.Server/Dockerfile -t embeddings-server:ci .
          docker images embeddings-server:ci
          if docker run --rm embeddings-server:ci; then echo "the image started with no key" >&2; exit 1; fi
          docker run -d --name embeddings-server -p 127.0.0.1:8081:8080 -e Embeddings__ApiKey=ci-key -e Embeddings__Offline=true \
            -v "$PWD/artifacts/hosted-models:/data:ro" embeddings-server:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8081/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8081/embed_sparse -d '{"texts":["a"]}' -H 'Content-Type: application/json')" = 401
          curl -sf -X POST http://127.0.0.1:8081/ -H 'Content-Type: application/json' -H 'x-chroma-token: ci-key' \
            -d '{"instructions":"","texts":["def add(a, b): return a + b"]}' | python3 -c "import json, sys; v = json.load(sys.stdin)['embeddings'][0]; assert len(v) == 1024; print('1024 dimensions')"
          docker logs embeddings-server

  # The package of the tool, and the image for linux/amd64 and linux/arm64 with the options of the release, on one runner: the build stage
  # runs on the platform of the runner, and the final one has no RUN step, so no emulation is needed. A tag of the service pushes it.
  server-image:
    name: Image of the service for x64 and arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: The tag is server-v and the version of the service, a preview
        run: |
          version=$(dotnet msbuild src/ChromaDotNet.Embeddings.Server -getProperty:Version -nologo)
          if [[ "$GITHUB_REF" == refs/tags/server-v* ]]; then
            bash build/check-server-version.sh "$GITHUB_REF_NAME"
          else
            bash build/check-server-version.sh "server-v$version"
            if bash build/check-server-version.sh "server-v0.0.0-preview.0"; then echo "a wrong tag passed" >&2; exit 1; fi
          fi
      - name: Pack the tool
        run: dotnet pack src/ChromaDotNet.Embeddings.Server -c Release -o artifacts/server-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-package
          path: artifacts/server-package
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: The image for both architectures
        run: |
          version=$(dotnet msbuild src/ChromaDotNet.Embeddings.Server -getProperty:Version -nologo)
          description="A service that computes chroma-cloud-qwen and chroma-cloud-splade as the embedding service of Chroma Cloud does. Independent project. Not affiliated with, endorsed by or sponsored by Chroma Inc. CHROMA is a registered trademark of Chroma Inc., used here only to describe compatibility."
          docker buildx build --platform linux/amd64,linux/arm64 -f src/ChromaDotNet.Embeddings.Server/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=$description" --annotation "index:org.opencontainers.image.description=$description" \
            --label "org.opencontainers.image.version=$version" --label "org.opencontainers.image.licenses=MIT" \
            -t "ghcr.io/chromadotnet/embeddings-server:$version" --output type=oci,dest="$RUNNER_TEMP/image.tar" .
          ls -l "$RUNNER_TEMP/image.tar"

  publish:
    name: Publish the preview
    needs: [pack, test, python-reference]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: nuget
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packages/*.nupkg
            packages/*.snupkg

      - name: Collect the provenance
        run: |
          for file in packages/*.nupkg packages/*.snupkg; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref "refs/tags/$TAG" --format json --jq '.[].attestation.bundle' >> bundles.jsonl
          done
          sort -u bundles.jsonl > "packages/provenance-$TAG.intoto.jsonl"

      - name: GitHub release
        run: |
          version="${TAG#v}"
          sed -e "s/VERSION/$version/g" build/release-notes.md > notes.md
          gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "ChromaDotNet.Embeddings $version" --notes-file notes.md

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER || 'Laurianti' }}

      - name: Publish to NuGet.org
        run: dotnet nuget push 'packages/*.nupkg' --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-server:
    name: Publish the service
    needs: [server, server-image]
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: nuget
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-package
          path: packages
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: The tag is server-v and the version of the service, a preview
        run: bash build/check-server-version.sh "$TAG"

      - name: Attest build provenance of the tool
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/*.nupkg
      - name: Collect the provenance
        run: |
          for file in packages/*.nupkg; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref "refs/tags/$TAG" --format json --jq '.[].attestation.bundle' >> bundles.jsonl
          done
          sort -u bundles.jsonl > "packages/provenance-$TAG.intoto.jsonl"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The image, on GHCR
        id: image
        run: |
          version="${TAG#server-v}"
          description="A service that computes chroma-cloud-qwen and chroma-cloud-splade as the embedding service of Chroma Cloud does. Independent project. Not affiliated with, endorsed by or sponsored by Chroma Inc. CHROMA is a registered trademark of Chroma Inc., used here only to describe compatibility."
          docker buildx build --platform linux/amd64,linux/arm64 -f src/ChromaDotNet.Embeddings.Server/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=$description" --annotation "index:org.opencontainers.image.description=$description" \
            --label "org.opencontainers.image.version=$version" --label "org.opencontainers.image.licenses=MIT" \
            -t "ghcr.io/chromadotnet/embeddings-server:$version" --push --metadata-file "$RUNNER_TEMP/metadata.json" .
          echo "digest=$(jq -r '.["containerimage.digest"]' "$RUNNER_TEMP/metadata.json")" >> "$GITHUB_OUTPUT"
      - name: Build provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/chromadotnet/embeddings-server
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sigstore signature of the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/chromadotnet/embeddings-server@$DIGEST"

      - name: GitHub release
        run: |
          version="${TAG#server-v}"
          sed -e "s/VERSION/$version/g" -e "s/TAG/$TAG/g" build/server-release-notes.md > notes.md
          gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "ChromaDotNet.Embeddings.Server $version" --notes-file notes.md

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER || 'Laurianti' }}
      - name: Publish the tool to NuGet.org
        run: dotnet nuget push 'packages/*.nupkg' --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
